<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-label="Cyberpunk Theyyam artwork">
  <defs>
    <path id="spike" d="M450 108 L418 192 L482 192 Z"/>
  </defs>

  <!-- ===== MUDI FAN (headdress) ===== -->
  <!-- outer flame spikes along the arc -->
  <g fill="#FF3D2E">
    <use href="#spike" transform="rotate(-72 450 560)"/>
    <use href="#spike" transform="rotate(-60 450 560)"/>
    <use href="#spike" transform="rotate(-48 450 560)"/>
    <use href="#spike" transform="rotate(-36 450 560)"/>
    <use href="#spike" transform="rotate(-24 450 560)"/>
    <use href="#spike" transform="rotate(-12 450 560)"/>
    <use href="#spike"/>
    <use href="#spike" transform="rotate(12 450 560)"/>
    <use href="#spike" transform="rotate(24 450 560)"/>
    <use href="#spike" transform="rotate(36 450 560)"/>
    <use href="#spike" transform="rotate(48 450 560)"/>
    <use href="#spike" transform="rotate(60 450 560)"/>
    <use href="#spike" transform="rotate(72 450 560)"/>
  </g>
  <!-- gold spike tips between -->
  <g fill="#FBBF24">
    <use href="#spike" transform="rotate(-66 450 560) scale(1) translate(0 46)"/>
    <use href="#spike" transform="rotate(-42 450 560) translate(0 46)"/>
    <use href="#spike" transform="rotate(-18 450 560) translate(0 46)"/>
    <use href="#spike" transform="rotate(6 450 560) translate(0 46)"/>
    <use href="#spike" transform="rotate(30 450 560) translate(0 46)"/>
    <use href="#spike" transform="rotate(54 450 560) translate(0 46)"/>
  </g>

  <!-- fan discs -->
  <path d="M80 560 A370 370 0 0 1 820 560 Z" fill="#C2240F"/>
  <path d="M150 560 A300 300 0 0 1 750 560 Z" fill="#7A1004"/>
  <path d="M220 560 A230 230 0 0 1 680 560 Z" fill="#0A0A0A"/>
  <!-- rim details -->
  <path d="M96 560 A354 354 0 0 1 804 560" fill="none" stroke="#FBBF24" stroke-width="6"/>
  <path d="M166 560 A284 284 0 0 1 734 560" fill="none" stroke="#FBBF24" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round"/>
  <path d="M236 560 A214 214 0 0 1 664 560" fill="none" stroke="#FF3D2E" stroke-width="5"/>
  <!-- ornament dots on middle band -->
  <g fill="#FBBF24">
    <circle cx="450" cy="235" r="10" transform="rotate(-58 450 560)"/>
    <circle cx="450" cy="235" r="10" transform="rotate(-38 450 560)"/>
    <circle cx="450" cy="235" r="10" transform="rotate(-19 450 560)"/>
    <circle cx="450" cy="235" r="10"/>
    <circle cx="450" cy="235" r="10" transform="rotate(19 450 560)"/>
    <circle cx="450" cy="235" r="10" transform="rotate(38 450 560)"/>
    <circle cx="450" cy="235" r="10" transform="rotate(58 450 560)"/>
  </g>
  <!-- chevrons on inner dark band -->
  <g fill="none" stroke="#FF3D2E" stroke-width="6" stroke-linecap="round">
    <path d="M305 420 l20 -24 l20 24" transform="rotate(-30 450 560)"/>
    <path d="M305 420 l20 -24 l20 24"/>
    <path d="M305 420 l20 -24 l20 24" transform="rotate(30 450 560)"/>
  </g>

  <!-- ===== CABLES from the fan ===== -->
  <path d="M112 580 C 84 690, 160 740, 158 866" fill="none" stroke="#FBBF24" stroke-width="5"/>
  <circle cx="158" cy="874" r="9" fill="#FBBF24"/>
  <path d="M788 580 C 816 690, 740 740, 742 866" fill="none" stroke="#FF3D2E" stroke-width="5"/>
  <circle cx="742" cy="874" r="9" fill="#FF3D2E"/>
  <path d="M150 620 C 140 700, 200 730, 196 800" fill="none" stroke="#7A1004" stroke-width="4"/>
  <path d="M750 620 C 760 700, 700 730, 704 800" fill="none" stroke="#7A1004" stroke-width="4"/>

  <!-- ===== SHOULDERS / CHEST ===== -->
  <path d="M225 1000 L292 822 Q 450 756 608 822 L675 1000 Z" fill="#120606" stroke="#7A1004" stroke-width="5"/>
  <path d="M310 846 Q 450 788 590 846" fill="none" stroke="#C2240F" stroke-width="8"/>
  <rect x="376" y="880" width="148" height="30" rx="9" fill="#0A0A0A" stroke="#FBBF24" stroke-width="3"/>
  <rect x="388" y="887" width="24" height="16" rx="4" fill="#FF3D2E"/>
  <rect x="420" y="887" width="24" height="16" rx="4" fill="#FBBF24"/>
  <rect x="452" y="887" width="24" height="16" rx="4" fill="#FF3D2E" opacity=".45"/>
  <rect x="484" y="887" width="24" height="16" rx="4" fill="#FBBF24" opacity=".45"/>
  <!-- shoulder studs -->
  <circle cx="320" cy="876" r="7" fill="#FBBF24"/>
  <circle cx="580" cy="876" r="7" fill="#FBBF24"/>

  <!-- ===== NECK ===== -->
  <rect x="406" y="690" width="88" height="86" fill="#C2240F"/>
  <path d="M406 742 h88" stroke="#7A1004" stroke-width="6"/>

  <!-- ===== FACE ===== -->
  <ellipse cx="450" cy="572" rx="132" ry="152" fill="#FF3D2E" stroke="#7A1004" stroke-width="6"/>
  <!-- forehead band -->
  <rect x="328" y="452" width="244" height="42" rx="15" fill="#0A0A0A" stroke="#FBBF24" stroke-width="3"/>
  <circle cx="366" cy="473" r="6" fill="#FBBF24"/>
  <circle cx="408" cy="473" r="6" fill="#FBBF24"/>
  <circle cx="450" cy="473" r="8" fill="#FF3D2E"/>
  <circle cx="492" cy="473" r="6" fill="#FBBF24"/>
  <circle cx="534" cy="473" r="6" fill="#FBBF24"/>
  <!-- white eye masks (theyyam makeup) -->
  <path d="M340 552 Q 395 522 448 552 Q 395 588 340 552 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
  <path d="M452 552 Q 505 522 560 552 Q 505 588 452 552 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="7"/>
  <!-- left pupil -->
  <circle cx="394" cy="553" r="12" fill="#0A0A0A"/>
  <circle cx="398" cy="549" r="4" fill="#FBBF24"/>
  <!-- right eye: targeting lens -->
  <circle cx="506" cy="553" r="15" fill="#0A0A0A" stroke="#FBBF24" stroke-width="3"/>
  <circle cx="506" cy="553" r="5" fill="#FBBF24"/>
  <circle cx="506" cy="553" r="27" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M506 518 v10 M506 578 v10 M471 553 h10 M531 553 h10" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  <!-- eye flame tails -->
  <path d="M338 548 l-26 -10 M338 558 l-24 8" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round"/>
  <path d="M562 548 l26 -10 M562 558 l24 8" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M450 568 L436 632 h28 Z" fill="#C2240F"/>
  <!-- cheek dots -->
  <g fill="#FFFFFF">
    <circle cx="344" cy="612" r="6"/><circle cx="334" cy="634" r="6"/><circle cx="346" cy="656" r="6"/>
    <circle cx="556" cy="612" r="6"/><circle cx="566" cy="634" r="6"/><circle cx="554" cy="656" r="6"/>
  </g>
  <!-- mustache -->
  <path d="M362 652 Q 450 706 538 652" fill="none" stroke="#0A0A0A" stroke-width="11" stroke-linecap="round"/>
  <path d="M374 664 Q 450 710 526 664" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <!-- mouth -->
  <rect x="408" y="676" width="84" height="17" rx="8.5" fill="#0A0A0A"/>
  <!-- chin arc -->
  <path d="M398 712 Q 450 736 502 712" fill="none" stroke="#7A1004" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== GLITCH SLICES ===== -->
  <g>
    <rect x="128" y="366" width="200" height="12" fill="#FBBF24" opacity=".8"/>
    <rect x="112" y="382" width="120" height="6" fill="#FFFFFF" opacity=".55"/>
    <rect x="588" y="298" width="196" height="12" fill="#FF3D2E" opacity=".8"/>
    <rect x="648" y="314" width="118" height="6" fill="#FFFFFF" opacity=".5"/>
    <rect x="606" y="648" width="150" height="9" fill="#FBBF24" opacity=".7"/>
    <rect x="140" y="700" width="132" height="9" fill="#FF3D2E" opacity=".7"/>
  </g>

  <!-- ===== HUD MARKS ===== -->
  <g stroke="#FBBF24" stroke-width="3" stroke-linecap="round">
    <path d="M70 160 h26 M83 147 v26"/>
    <path d="M818 190 h22 M829 179 v22"/>
    <path d="M96 920 h22 M107 909 v22"/>
    <path d="M800 950 h22 M811 939 v22"/>
  </g>
</svg>
